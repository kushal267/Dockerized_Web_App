{% extends "base.html" %}
{% block title %}Calendar View{% endblock %}
{% block content %}

<!-- FullCalendar CSS -->
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>

<div class="container mt-5 mb-5">
    <h2 class="mb-4">Task Calendar</h2>
    <div class="card shadow p-4 border-0 rounded-4">
        <div id='calendar'></div>
    </div>
</div>

<!--  Task Modal -->
<div class="modal fade" id="addTaskModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Add Task for <span id="selectedDateText"></span></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form method="POST" action="/add_task">
          <div class="modal-body">
              <input type="hidden" name="due_date" id="modalDueDate">
              <input type="text" name="title" class="form-control mb-3" placeholder="Task Title" required>
              <textarea name="description" class="form-control mb-3" placeholder="Description"></textarea>
              <div class="row">
                  <div class="col-6">
                      <select name="priority" class="form-select mb-3">
                          <option value="Low">Low</option>
                          <option value="Medium" selected>Medium</option>
                          <option value="High">High</option>
                      </select>
                  </div>
                  <div class="col-6">
                      <select name="status" class="form-select mb-3">
                          <option value="Pending">Pending</option>
                          <option value="In Progress">In Progress</option>
                      </select>
                  </div>
              </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary w-100">Save Task</button>
          </div>
      </form>
    </div>
  </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,listWeek'
            },
            themeSystem: 'bootstrap5',
            events: '/api/tasks', // Backend task fetching
            
            
            dateClick: function(info) {
                document.getElementById('modalDueDate').value = info.dateStr;
                document.getElementById('selectedDateText').innerText = info.dateStr;
                var myModal = new bootstrap.Modal(document.getElementById('addTaskModal'));
                myModal.show();
            }
        });
        calendar.render();
    });
</script>
{% endblock %}
